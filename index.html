/* =====================================================================
   MC2 — Estilos
   Azul corporativo + naranja construccion. Mobile first.
   ===================================================================== */

:root{
  --azul:#0C447C; --azul-2:#185FA5; --azul-3:#378ADD; --azul-luz:#E6F1FB;
  --naranja:#EF9F27; --naranja-osc:#854F0B; --naranja-luz:#FAEEDA;
  --verde:#1D9E75; --verde-osc:#27500A; --verde-luz:#EAF3DE;
  --rojo:#E24B4A; --rojo-osc:#A32D2D; --rojo-luz:#FCEBEB;
  --negro:#2C2C2A; --gris:#5F5E5A; --gris-2:#888780; --gris-3:#D3D1C7;
  --gris-luz:#F1EFE8; --blanco:#FFFFFF;
  --r:10px; --r-g:14px;
  --sombra:0 1px 3px rgba(0,0,0,.08);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--gris-luz); color:var(--negro);
  font-size:16px; line-height:1.5;
  overscroll-behavior-y:contain;
}
#app{max-width:480px; margin:0 auto; background:var(--blanco); min-height:100vh;
     display:flex; flex-direction:column; position:relative}

/* ---------- Cabecera ----------
   El padding de arriba respeta la barra de estado del iPhone.
   Sin esto, el titulo y el boton de volver quedan DEBAJO de la hora
   y del notch, y el boton no se puede tocar. */
.cab{background:var(--azul); color:#fff;
     padding:calc(14px + env(safe-area-inset-top, 0px)) 16px 14px}
.cab-fila{display:flex; align-items:center; gap:10px}
.cab h1{font-size:18px; margin:0; font-weight:600}
.cab .sub{font-size:12px; color:#85B7EB; margin-top:2px}
.cab .saludo{font-size:12px; color:#85B7EB}
.cab .pregunta{font-size:19px; font-weight:600; margin-top:2px}
/* Area de toque grande: un boton de 44px es lo minimo comodo en un celular */
.volver{background:none;border:0;color:#E6F1FB;font-size:24px;line-height:1;
        min-width:44px;min-height:44px;margin-left:-10px;cursor:pointer;
        display:flex;align-items:center;justify-content:center}
.volver:active{opacity:.5}
.chip-zona{margin-top:11px;background:var(--azul-2);border:0;border-radius:20px;
  padding:7px 12px;color:#E6F1FB;font-size:12px;display:inline-flex;align-items:center;
  gap:6px;cursor:pointer;font-family:inherit}

/* ---------- Contenido ---------- */
.cont{flex:1; padding:16px; padding-bottom:90px}
.seccion-tit{font-size:13px;font-weight:600;color:var(--azul);margin:0 0 8px}
.ayuda{font-size:12px;color:var(--gris-2);margin:6px 0 0}

/* ---------- Rejilla de servicios ---------- */
.rejilla{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.serv{background:var(--azul-luz);border:0;border-radius:var(--r-g);padding:15px 4px;
  text-align:center;cursor:pointer;font-family:inherit;transition:transform .08s}
.serv:active{transform:scale(.96)}
.serv .ico{font-size:27px;line-height:1}
.serv .txt{font-size:11.5px;color:var(--azul);font-weight:600;margin-top:6px;display:block}

/* ---------- Tarjetas ---------- */
.tarjeta{background:#fff;border:1px solid var(--gris-3);border-radius:var(--r-g);
  padding:13px;margin-bottom:10px}
.tarjeta.destacada{border:2px solid var(--naranja)}
.tarjeta.plana{border:0;background:var(--gris-luz)}

.item{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.item .nom{font-size:14.5px;font-weight:600;margin:0}
.item .det{font-size:12px;color:var(--gris-2);margin:3px 0 0}
.item .precio{font-size:21px;font-weight:700;color:#042C53;white-space:nowrap}
.item .neto{font-size:11px;color:#3B6D11;text-align:right;margin-top:2px}

/* ---------- Botones ---------- */
.btn{display:block;width:100%;border:0;border-radius:var(--r);padding:14px;
  font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;
  transition:transform .08s, opacity .15s}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primario{background:var(--naranja);color:#412402}
.btn-azul{background:var(--azul);color:#fff}
.btn-suave{background:var(--gris-luz);color:var(--negro)}
.btn-linea{background:#fff;border:1px solid var(--gris-3);color:var(--negro)}
.btn-chico{padding:10px;font-size:13.5px}
.fila-btn{display:flex;gap:8px}
.fila-btn .btn{flex:1}

/* ---------- Formularios ---------- */
label{display:block;font-size:13px;font-weight:600;color:var(--azul);margin:14px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--gris-3);
  border-radius:var(--r);font-size:16px;font-family:inherit;background:#fff;color:var(--negro)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--azul-3);
  box-shadow:0 0 0 3px rgba(55,138,221,.15)}
textarea{min-height:76px;resize:vertical}

.opciones{display:flex;gap:7px}
.opcion{flex:1;text-align:center;padding:11px 4px;border:1px solid var(--gris-3);
  border-radius:var(--r);font-size:12.5px;cursor:pointer;background:#fff;
  font-family:inherit;color:var(--gris)}
.opcion.activa{border:2px solid var(--naranja);background:var(--naranja-luz);
  color:var(--naranja-osc);font-weight:600}
.opcion .ico{display:block;font-size:19px;margin-bottom:3px}

/* ---------- Zona de foto ---------- */
.foto-zona{background:var(--azul-luz);border:2px dashed var(--azul-3);
  border-radius:var(--r-g);min-height:132px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:5px;cursor:pointer;padding:14px;
  text-align:center}
.foto-zona .ico{font-size:32px}
.foto-zona .t{font-size:13.5px;color:var(--azul);font-weight:600}
.foto-zona .s{font-size:11.5px;color:var(--azul-2)}
.foto-previa{width:100%;border-radius:var(--r-g);display:block;max-height:230px;
  object-fit:cover}

/* ---------- Avisos ---------- */
.aviso{border-radius:var(--r-g);padding:12px 14px;font-size:13px;margin-bottom:12px;
  line-height:1.5}
.aviso-naranja{background:var(--naranja-luz);border:1px solid var(--naranja);color:var(--naranja-osc)}
.aviso-verde{background:var(--verde-luz);border:1px solid var(--verde);color:var(--verde-osc)}
.aviso-azul{background:var(--azul-luz);color:var(--azul)}
.aviso-rojo{background:var(--rojo-luz);border:1px solid var(--rojo);color:var(--rojo-osc)}
.aviso b{display:block;margin-bottom:3px}

.etiqueta{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 9px;
  border-radius:20px;letter-spacing:.02em}
.et-roja{background:var(--rojo-luz);color:var(--rojo-osc)}
.et-naranja{background:var(--naranja-luz);color:var(--naranja-osc)}
.et-verde{background:var(--verde-luz);color:var(--verde-osc)}
.et-azul{background:var(--azul-luz);color:var(--azul)}
.et-gris{background:var(--gris-luz);color:var(--gris)}

/* ---------- Barra inferior ----------
   El padding de abajo respeta la franja del boton de inicio del iPhone. */
.barra{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--gris-3);
  display:flex;max-width:480px;margin:0 auto;width:100%;
  padding:8px 0 calc(10px + env(safe-area-inset-bottom, 0px))}
.barra button{flex:1;background:none;border:0;cursor:pointer;font-family:inherit;
  color:var(--gris-2);padding:2px}
.barra button .ico{font-size:20px;display:block}
.barra button .txt{font-size:10px;display:block;margin-top:1px}
.barra button.activo{color:var(--azul);font-weight:600}

/* ---------- Barra de progreso del trabajo ---------- */
.pasos{display:flex;gap:4px;margin-bottom:6px}
.pasos i{flex:1;height:5px;border-radius:3px;background:var(--gris-3)}
.pasos i.ok{background:var(--verde)}
.pasos-txt{display:flex;justify-content:space-between;font-size:10px;color:var(--gris-2);
  margin-bottom:14px}
.pasos-txt b{color:var(--verde-osc);font-weight:600}

/* ---------- Resumen de dinero ---------- */
.dinero{background:var(--gris-luz);border-radius:var(--r-g);padding:13px;margin:12px 0}
.dinero .l{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;
  color:var(--gris)}
.dinero .l.total{border-top:1px solid var(--gris-3);margin-top:5px;padding-top:9px;
  font-weight:700;color:var(--negro);font-size:16px}

/* ---------- Cinta de modo demo ---------- */
.cinta-demo{background:var(--naranja);color:#412402;text-align:center;
  font-size:11.5px;font-weight:700;padding:6px 10px;letter-spacing:.02em}

/* ---------- Estados ---------- */
.vacio{text-align:center;padding:46px 20px;color:var(--gris-2)}
.vacio .ico{font-size:42px;display:block;margin-bottom:10px}
.cargando{text-align:center;padding:40px;color:var(--gris-2);font-size:14px}
.error-caja{background:var(--rojo-luz);border:1px solid var(--rojo);color:var(--rojo-osc);
  border-radius:var(--r);padding:12px;font-size:13px;margin-bottom:12px}

/* ---------- Aparecer ---------- */
.vista{animation:entra .18s ease-out}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Aviso de instalar ---------- */
.instalar{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;
  background:var(--azul);color:#fff;padding:14px 16px;display:flex;align-items:center;
  gap:12px;z-index:50}
.instalar .t{flex:1;font-size:13px;line-height:1.4}
.instalar button{background:var(--naranja);color:#412402;border:0;border-radius:var(--r);
  padding:9px 14px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.instalar .x{background:none;color:#85B7EB;padding:4px 8px;font-size:18px}

</style>
</head>

const CONFIG = {

  SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im10Z2hmdWlpaGdxZ25jamVpc3lmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3ODk3NjIsImV4cCI6MjEwMTM2NTc2Mn0.uVzlKX4v1mW2mz7AhDYc90FrLtwCHTcKpXsvy_tyuUs",


  // ---- PALANCA DE COBRO ----
  // Cambia SOLO esta palabra para cambiar como cobra la app entera.
  // Las tres opciones son:
  //
  //   "al_final"    El cliente no paga nada por adelantado. Paga todo

  //
  //   "50_50"       Paga la mitad al pedir y la mitad al terminar.
  //
  //   "adelantado"  Paga todo al pedir. MC2 le retiene la plata al

  //
  // Si un contratista se queja de que un cliente no le pago, cambia
  // esto a "adelantado", guarda, y vuelve a publicar. Nada mas.
  COBRO: "al_final",


  // ---- CADA CUANTO SE ACTUALIZA LA PANTALLA SOLA ----
  //
  // Segundos. La app se refresca sola mientras la pantalla esta abierta,
  // asi el contratista ve entrar el trabajo y el cliente ve llegar los
  // precios sin tocar nada.
  //
  // Solo corre en las pantallas donde se espera algo, y se apaga cuando
  // el celular se guarda en el bolsillo: no gasta datos ni bateria de

  //

  SEGUNDOS_REFRESCO: 12,

  ZONAS: [
    "Costa del Este",

    "San Francisco",

  ]

// true = la app esta conectada a Supabase de verdad
// false = la app corre con datos de prueba (modo demo)

return { CONFIG, HAY_SUPABASE };
})();


/* ===== datos.js ===== */
__M["datos"] = (function(){
// =====================================================================
//  MC2 — CAPA DE DATOS
//  Habla con Supabase si esta configurado. Si no, usa datos de prueba
//  guardados en el propio celular (modo demo).
//  Leo: no necesitas tocar este archivo.
// =====================================================================

const { CONFIG, HAY_SUPABASE } = __M["config"];

// ---------------------------------------------------------------- reglas
// Espejo exacto de las funciones del schema de Supabase.
// Si cambias un numero aqui, cambialo tambien en la tabla "parametros".
const REGLAS = {
  comision: { bronce: 12, plata: 10, oro: 8, platino: 6, recurrente: 5 },
  comisionMinima: 3,
  tarifa: { t1: 2, t2: 6, t3: 10, pct: 4 },
  umbral: { u1: 40, u2: 100, u3: 300 },
  tarifaTopePct: 10,
  anticipoPct: 50,
  diasGarantia: 7,
  ratingMinimoPH: 4.5
};
const NIVELES = {
  bronce:  { nombre:"Bronce",  min:0,   rating:0,    pct:12 },
  plata:   { nombre:"Plata",   min:11,  rating:4.5,  pct:10 },
  oro:     { nombre:"Oro",     min:41,  rating:4.7,  pct:8  },
  platino: { nombre:"Platino", min:101, rating:4.8,  pct:6  }
};

const r2 = (n) => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
function calcularTarifaCliente(base, { suscrito = false, exento = false } = {}) {
  base = Number(base) || 0;
  if (suscrito || exento) return 0;
  let escalon;
  if (base < REGLAS.umbral.u1) escalon = REGLAS.tarifa.t1;
  else if (base <= REGLAS.umbral.u2) escalon = REGLAS.tarifa.t2;
  else if (base <= REGLAS.umbral.u3) escalon = REGLAS.tarifa.t3;
  else escalon = r2((base * REGLAS.tarifa.pct) / 100);
  return r2(Math.min(escalon, (base * REGLAS.tarifaTopePct) / 100));
}
function calcularComision(base, nivel = "bronce", recurrente = false) {
  base = Number(base) || 0;
  const pct = recurrente ? REGLAS.comision.recurrente : (REGLAS.comision[nivel] ?? REGLAS.comision.bronce);
  let c = r2((base * pct) / 100);
  if (c < REGLAS.comisionMinima) c = REGLAS.comisionMinima;
  if (c > base) c = base;
  return { pct, monto: c };
}

// Cuanto se cobra por adelantado, segun la palanca COBRO de config.js
function porcentajeAnticipo(cobro = CONFIG.COBRO) {
  if (cobro === "adelantado") return 100;
  if (cobro === "50_50") return REGLAS.anticipoPct;
  return 0; // "al_final"
}
function economia(base, opts = {}) {
  base = Number(base) || 0;
  const tarifa = calcularTarifaCliente(base, opts);
  const com = calcularComision(base, opts.nivel, opts.recurrente);
  const total = r2(base + tarifa);
  const anticipo = r2((total * porcentajeAnticipo(opts.cobro)) / 100);
  const saldo = r2(total - anticipo);
  return {
    base: r2(base), tarifa, totalCliente: total,
    anticipo, saldo,
    comisionPct: com.pct, comision: com.monto,
    netoContratista: r2(base - com.monto),
    ingresoMC2: r2(com.monto + tarifa)
  };
}

// sube de nivel segun trabajos y estrellas (espejo de recalcular_nivel en SQL)
function nivelPara(trabajos, rating, esFundador = false) {
  let n = "bronce";
  if (trabajos > 100 && rating >= 4.8) n = "platino";
  else if (trabajos > 40 && rating >= 4.7) n = "oro";
  else if (trabajos > 10 && rating >= 4.5) n = "plata";
  if (esFundador && (n === "bronce" || n === "plata")) n = "oro";
  return n;
}
function faltaParaSubir(trabajos, rating) {
  const orden = ["bronce","plata","oro","platino"];
  const actual = nivelPara(trabajos, rating);
  const sig = orden[orden.indexOf(actual) + 1];
  if (!sig) return null;
  return { nivel: NIVELES[sig].nombre, faltan: Math.max(0, NIVELES[sig].min - trabajos), pct: NIVELES[sig].pct };
}
const money = (n) => `${CONFIG.MONEDA} ${(Number(n) || 0).toFixed(2)}`;

// ---------------------------------------------------------------- catalogo
const CATEGORIAS = [
  { id: "plomeria",     nombre: "Plomeria",     ico: "\u{1F6BF}" },
  { id: "electricidad", nombre: "Electricidad", ico: "⚡"     },
  { id: "aire",         nombre: "A/C",          ico: "❄️" },
  { id: "pintura",      nombre: "Pintura",      ico: "\u{1F3A8}" },
  { id: "cerrajeria",   nombre: "Cerrajeria",   ico: "\u{1F511}" },
  { id: "otros",        nombre: "Otros",        ico: "\u{1F527}" }
];
const SERVICIOS = [

let catalogoCargado = false;
async function cargarCatalogo() {
  const c = await cliente();
  if (!c) return false;
  try {
    const [rc, rs] = await Promise.all([
      c.from("categorias").select("*").eq("activa", true).order("orden"),
      c.from("servicios").select("*").eq("activo", true).order("orden")
    ]);
    const cats = rc.data, servs = rs.data;

    // Si no llego nada, decimos que fallo. Antes esto devolvia "listo"
    // aunque no hubiera traido un solo precio, y eso escondia el problema.
    if (rc.error || rs.error || !Array.isArray(servs) || !servs.length) {
      console.warn("MC2: el catalogo no cargo, uso los precios de respaldo.",
                   rc.error || rs.error);
      return false;
    }

    if (Array.isArray(cats) && cats.length) {
      const iconos = Object.fromEntries(CATEGORIAS.map(x => [x.id, x.ico]));
      CATEGORIAS.length = 0;
      for (const x of cats) {
        CATEGORIAS.push({ id: x.id, nombre: x.nombre, ico: iconos[x.id] || "\u{1F527}" });
      }
    }

    if (Array.isArray(servs) && servs.length) {
      SERVICIOS.length = 0;
      for (const s of servs) {
        SERVICIOS.push({
          id: s.id,
          cat: s.categoria_id,
          nombre: s.nombre,
          precio: s.precio_fijo != null ? Number(s.precio_fijo) : null,
          min: s.duracion_min || 60,
          incluye: s.incluye || "",
          exento: !!s.exento_tarifa,
          rango: (s.rango_min != null && s.rango_max != null)
            ? [Number(s.rango_min), Number(s.rango_max)] : [50, 500]
        });
      }
    }
    catalogoCargado = true;
    return true;
  } catch (e) {
    console.warn("MC2: no se pudo cargar el catalogo, uso los precios de respaldo.", e);
    return false;
  }
}

const LLAVE_SESION = "mc2_sesion";

function leerSesion() {
  try { return JSON.parse(localStorage.getItem(LLAVE_SESION) || "null"); }
  catch (e) { return null; }
}
function guardarSesion(s) {
  try {
    if (s) localStorage.setItem(LLAVE_SESION, JSON.stringify(s));
    else localStorage.removeItem(LLAVE_SESION);
  } catch (e) { /* almacenamiento bloqueado */ }
}

function mensajeDeError(j, respuesta) {
  return j?.error_description || j?.msg || j?.message || j?.error
      || `Error ${respuesta?.status || ""}`.trim();
}

function crearCliente(url, llave) {
  const base = String(url).replace(/\/+$/, "");
  let sesion = leerSesion();

  const cabeceras = (extra = {}) => ({
    apikey: llave,
    Authorization: "Bearer " + (sesion?.access_token || llave),
    ...extra
  });

  async function pedir(ruta, opciones = {}, reintentar = true) {
    const r = await fetch(base + ruta, opciones);
    // Si el permiso vencio, renovamos y repetimos una sola vez.
    if (r.status === 401 && sesion?.refresh_token && reintentar) {
      const ok = await renovar();
      if (ok) {
        opciones.headers = { ...opciones.headers, ...cabeceras() };
        return pedir(ruta, opciones, false);
      }
    }
    return r;
  }

  async function renovar() {
    try {
      const r = await fetch(`${base}/auth/v1/token?grant_type=refresh_token`, {
        method: "POST",
        headers: { apikey: llave, "Content-Type": "application/json" },
        body: JSON.stringify({ refresh_token: sesion.refresh_token })
      });
      if (!r.ok) { sesion = null; guardarSesion(null); return false; }
      const j = await r.json();
      sesion = j; guardarSesion(j);
      return true;
    } catch (e) { return false; }
  }

  // ---------------------------------------------------------- auth
  const auth = {
    async signUp({ email, password }) {
      try {
        const r = await fetch(`${base}/auth/v1/signup`, {
          method: "POST",
          headers: { apikey: llave, "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) return { data: {}, error: { message: mensajeDeError(j, r) } };
        if (j.access_token) { sesion = j; guardarSesion(j); }
        const user = j.user || j;
        return { data: { user, session: j.access_token ? j : null }, error: null };
      } catch (e) {
        return { data: {}, error: { message: "Failed to fetch: " + e.message } };
      }
    },

    async signInWithPassword({ email, password }) {
      try {
        const r = await fetch(`${base}/auth/v1/token?grant_type=password`, {
          method: "POST",
          headers: { apikey: llave, "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) return { data: {}, error: { message: mensajeDeError(j, r) } };
        sesion = j; guardarSesion(j);
        return { data: { user: j.user, session: j }, error: null };
      } catch (e) {
        return { data: {}, error: { message: "Failed to fetch: " + e.message } };
      }
    },

    async signOut() {
      try {
        if (sesion?.access_token) {
          await fetch(`${base}/auth/v1/logout`, { method: "POST", headers: cabeceras() });
        }
      } catch (e) { /* igual cerramos local */ }
      sesion = null; guardarSesion(null);
      return { error: null };
    },

    async getUser() {
      if (!sesion?.access_token) return { data: { user: null }, error: null };
      try {
        const r = await pedir("/auth/v1/user", { headers: cabeceras() });
        if (!r.ok) { sesion = null; guardarSesion(null); return { data: { user: null }, error: null }; }
        return { data: { user: await r.json() }, error: null };
      } catch (e) {
        return { data: { user: null }, error: null };
      }
    }
  };

  // ------------------------------------------------- consultas a tablas
  class Consulta {
    constructor(tabla) {
      this.tabla = tabla; this.metodo = "GET"; this.cols = "*";
      this.filtros = []; this.orden = null; this.tope = null;
      this.cuerpo = null; this.uno = false; this.devolver = false;
    }
    select(c = "*") {
      if (this.metodo === "GET") this.cols = c; else this.devolver = true;
      return this;
    }
    insert(o) { this.metodo = "POST"; this.cuerpo = o; return this; }
    update(o) { this.metodo = "PATCH"; this.cuerpo = o; return this; }
    eq(c, v) { this.filtros.push(`${c}=eq.${encodeURIComponent(v)}`); return this; }
    in(c, arr) {
      this.filtros.push(`${c}=in.(${arr.map(x => encodeURIComponent(x)).join(",")})`);
      return this;
    }
    order(c, o = {}) { this.orden = `${c}.${o.ascending === false ? "desc" : "asc"}`; return this; }
    limit(n) { this.tope = n; return this; }
    single() { this.uno = true; return this; }
    then(ok, mal) { return this.ejecutar().then(ok, mal); }

    async ejecutar() {
      const partes = [...this.filtros];
      if (this.metodo === "GET") partes.unshift("select=" + encodeURIComponent(this.cols));
      if (this.orden) partes.push("order=" + this.orden);
      if (this.tope) partes.push("limit=" + this.tope);
      const ruta = `/rest/v1/${this.tabla}` + (partes.length ? "?" + partes.join("&") : "");

      const cab = cabeceras({ "Content-Type": "application/json" });
      if (this.uno) cab.Accept = "application/vnd.pgrst.object+json";
      if (this.metodo !== "GET") {
        cab.Prefer = this.devolver ? "return=representation" : "return=minimal";
      }

      try {
        const r = await pedir(ruta, {
          method: this.metodo,
          headers: cab,
          body: this.cuerpo ? JSON.stringify(this.cuerpo) : undefined
        });
        if (!r.ok) {
          const j = await r.json().catch(() => ({}));
          return { data: null, error: { message: mensajeDeError(j, r) } };
        }
        if (r.status === 204) return { data: null, error: null };
        const txt = await r.text();
        return { data: txt ? JSON.parse(txt) : null, error: null };
      } catch (e) {
        return { data: null, error: { message: "Failed to fetch: " + e.message } };
      }
    }
  }

  // ---------------------------------------------------------- archivos
  const storage = {
    from(cubeta) {
      return {
        async upload(ruta, archivo, opciones = {}) {
          try {
            const cab = cabeceras();
            if (opciones.upsert) cab["x-upsert"] = "true";
            const r = await fetch(`${base}/storage/v1/object/${cubeta}/${ruta}`, {
              method: "POST", headers: cab, body: archivo
            });
            if (!r.ok) {
              const j = await r.json().catch(() => ({}));
              return { data: null, error: { message: mensajeDeError(j, r) } };
            }
            return { data: await r.json().catch(() => ({})), error: null };
          } catch (e) {
            return { data: null, error: { message: e.message } };
          }
        }
      };
    }
  };

  // Llamar una funcion que vive dentro de la base de datos.
  // Se usa para activar y rechazar contratistas: la funcion vuelve a
  // comprobar el rol alla adentro, asi que no basta con saber la direccion.
  async function rpc(nombre, args = {}) {
    try {
      const r = await pedir(`/rest/v1/rpc/${nombre}`, {
        method: "POST",
        headers: cabeceras({ "Content-Type": "application/json" }),
        body: JSON.stringify(args)
      });
      const txt = await r.text();
      const j = txt ? JSON.parse(txt) : null;
      if (!r.ok) return { data: null, error: { message: mensajeDeError(j, r) } };
      return { data: j, error: null };
    } catch (e) {
      return { data: null, error: { message: "Failed to fetch: " + e.message } };
    }
  }

  return { auth, storage, rpc, from: (t) => new Consulta(t) };
}

        id: idNuevo(),
        folio: "MC2-" + String(d.trabajos.length + 1).padStart(6, "0"),
        servicioId: t.servicioId,
        servicioNombre: serv ? serv.nombre : "Trabajo",
        categoria: t.categoria, tipoPropiedad: t.tipoPropiedad, urgencia: t.urgencia,
        direccion: t.direccion, detalle: t.detalle || "", descripcion: t.descripcion || "",
        lat: t.lat ?? null, lng: t.lng ?? null,
        foto: t.foto || null, fotoDespues: null,
        modalidad: porCotizar ? "cotizacion" : "precio_fijo",
        cotizaHasta: porCotizar
          ? new Date(Date.now() + CONFIG.HORAS_COTIZACION * 3600000).toISOString() : null,
        estado: porCotizar ? "buscando" : "asignado",
        contratista: porCotizar ? null : asignado,
        contratistaId: porCotizar ? null : asignado.id,
        eco, pagos: [], creado: new Date().toISOString(), calificacion: null
      };
      d.trabajos.unshift(nuevo);
      if (porCotizar) sembrarCotizacionesDemo(d, nuevo);
      guardarDemo(d);
      return nuevo;
    }

    const { data, error } = await c.from("trabajos").insert({
      cliente_id: (await c.auth.getUser()).data.user?.id,
      servicio_id: t.servicioId, categoria_id: t.categoria,
      modalidad: porCotizar ? "cotizacion" : "precio_fijo",
      estado: "buscando", tipo_propiedad: t.tipoPropiedad, urgencia: t.urgencia,
      direccion: t.direccion, detalle_ubicacion: t.detalle || null,
      descripcion: t.descripcion || null,
      lat: t.lat ?? null, lng: t.lng ?? null,
      monto_base: porCotizar ? 0 : base,
      tarifa_cliente: porCotizar ? 0 : eco.tarifa,
      total_cliente: porCotizar ? 0 : eco.totalCliente
    }).select().single();
    if (error) throw new Error(traducir(error.message));

    // Abrir la ventana de cotizaciones es cosa de la base: ella pone la
    // hora de cierre y ella comprueba que no sea una emergencia.
    if (porCotizar) {
      try {
        const hasta = await pedirFuncion(c, "publicar_para_cotizar", { p_trabajo_id: data.id });
        data.cotiza_hasta = hasta;
      } catch (e) {
        // Si no se pudo publicar, el trabajo igual existe y sale por el
        // camino de siempre. Mejor eso que dejarlo en el limbo.
        console.error("MC2: no se pudo abrir la cotizacion", e);
      }
    }
    return normalizar(data);
  },

  // ============================ cotizaciones ============================
  //
  //  El precio lo pone el que hace el trabajo. El cliente publica, varios
  //  mandan su precio y el cliente escoge. Nadie ve el precio del otro:
  //  eso no lo decide la pantalla, lo decide la base de datos.
  //
  //  La emergencia NO pasa por aqui: se sigue asignando al mas cercano.

  async cotizacionesDe(trabajoId) {
    const c = await cliente();
    if (!c) {
      const d = leerDemo();
      return (d.cotizaciones || []).filter(q => q.trabajoId === trabajoId)
        .sort((a, b) => a.precio - b.precio);
    }
    const filas = await pedirFuncion(c, "cotizaciones_de", { p_trabajo_id: trabajoId });
    return (filas || []).map(q => ({
      id:q.id, contratistaId:q.contratista_id, nombre:q.nombre,
      rating:Number(q.rating) || 0, trabajos:q.trabajos || 0, nivel:q.nivel,
      verificado:!!q.verificado, precio:Number(q.precio),
      tarifa:Number(q.tarifa), total:Number(q.total),
      llegada:q.llegada, mensaje:q.mensaje || "", elegida:!!q.elegida, creada:q.creada
    }));
  },

  async elegirCotizacion(cotizacionId) {
    const c = await cliente();
    if (!c) {
      const d = leerDemo();
      const q = (d.cotizaciones || []).find(x => x.id === cotizacionId);
      if (!q) throw new Error("Esa cotizacion ya no esta.");
      const t = d.trabajos.find(x => x.id === q.trabajoId);
      if (!t) throw new Error("Ese trabajo ya no esta.");
      const serv = servicioPorId(t.servicioId);
      t.contratistaId = q.contratistaId;
      t.contratista = { id:q.contratistaId, nombre:q.nombre, rating:q.rating,
                        trabajos:q.trabajos, nivel:q.nivel };
      t.estado = "asignado";
      t.eco = economia(q.precio, { exento:!!serv?.exento, nivel:q.nivel || "oro" });
      t.llegadaEstimada = q.llegada;
      (d.cotizaciones || []).forEach(x => {
        if (x.trabajoId === q.trabajoId) x.elegida = (x.id === q.id);
      });
      guardarDemo(d);
      return t.id;
    }
    return await pedirFuncion(c, "elegir_cotizacion", { p_cotizacion_id: cotizacionId });
  },

  // Lo que manda el contratista.
  async cotizar(trabajoId, precio, llegadaISO, mensaje) {
    const c = await cliente();
    if (!c) {
      const d = leerDemo();
      d.cotizaciones = d.cotizaciones || [];
      const yo = d.contratista;
      if (!yo) throw new Error("Entra como contratista para cotizar.");
      const previa = d.cotizaciones.find(q => q.trabajoId === trabajoId && q.contratistaId === yo.id);
      const eco = economia(precio, { nivel: yo.nivel });
      const fila = {
        id: previa?.id || idNuevo(), trabajoId, contratistaId: yo.id,
        nombre: yo.nombre, rating: yo.rating || 0, trabajos: yo.trabajos || 0,
        nivel: yo.nivel, verificado: true,
        precio: r2(precio), tarifa: eco.tarifa, total: eco.totalCliente,
        llegada: llegadaISO, mensaje: mensaje || "", elegida: false,
        creada: new Date().toISOString()
      };
      if (previa) Object.assign(previa, fila); else d.cotizaciones.push(fila);
      guardarDemo(d);
      return fila.id;
    }
    return await pedirFuncion(c, "cotizar", {
      p_trabajo_id: trabajoId, p_precio: precio,
      p_llegada: llegadaISO, p_mensaje: mensaje || null
    });

  // Cuanto suele costar esto. Se le ensena al cliente mientras espera,
  // para que una cotizacion disparatada se le note.
  async rangoReferencia(categoria, servicioId) {
    const c = await cliente();
    const serv = servicioPorId(servicioId);
    const caida = serv?.rango
      ? { min: serv.rango[0], max: serv.rango[1], muestras: 0 }
      : serv?.precio
        ? { min: Math.round(serv.precio * 0.7), max: Math.round(serv.precio * 1.3), muestras: 0 }
        : null;
    if (!c) return caida;
    try {
      const r = await pedirFuncion(c, "rango_referencia",
        { p_categoria: categoria, p_servicio: servicioId || null });
      const f = (r || [])[0];
      if (!f || (!Number(f.minimo) && !Number(f.maximo))) return caida;
      return { min: Number(f.minimo), max: Number(f.maximo), muestras: Number(f.muestras) || 0 };
    } catch (e) { return caida; }
  },

  // QUIEN ES EL TECNICO QUE ME VA A LLEGAR.
  //
  // Esto faltaba y se notaba feo: el trabajo quedaba asignado, con su
  // precio y todo, y al cliente le seguia diciendo "Buscando tecnico
  // disponible...". Parecia que nadie habia tomado el trabajo.

  // Sale de la vista publica, que a proposito solo expone nombre,
  // calificacion, nivel y trabajos hechos. Ni cedula ni saldos ni

  async contratistasPublicos(ids = []) {
    const limpios = [...new Set(ids.filter(Boolean))];
    if (!limpios.length) return {};
    const c = await cliente();
    if (!c) {
      const m = {};

      .select("id,nombre,rating,trabajos_completados,nivel,verificado").in("id", limpios);

                  verificado:!!x.verificado };

  async misTrabajos() {
    const c = await cliente();
    if (!c) return leerDemo().trabajos;
    const { data, error } = await c.from("trabajos")
      .select("*").order("creado", { ascending:false }).limit(50);
    if (error) return [];
    const lista = (data || []).map(normalizar);
    // Una sola consulta para todos los tecnicos de la lista.
    const quienes = await this.contratistasPublicos(lista.map(t => t.contratistaId));

  async trabajo(id) {

  // Registra un pago del cliente. tipo = "anticipo" | "saldo"
  // El trabajo solo pasa a "pagado" cuando la suma de pagos cubre el total.
  async pagar(id, tipo) {
    const c = await cliente();
    const t0 = await this.trabajo(id);
    if (!t0) return null;
    const monto = tipo === "anticipo" ? t0.eco.anticipo : t0.eco.saldo;
    if (monto <= 0) return t0;

    if (!c) {
      const d = leerDemo();
      const t = d.trabajos.find(x => x.id === id);
      if (!t) return null;
      t.pagos = t.pagos || [];
      if (t.pagos.some(p => p.tipo === tipo)) return t; // no cobrar dos veces
      t.pagos.push({ tipo, monto, metodo:"yappy", fecha:new Date().toISOString() });
      if (r2(t.pagos.reduce((s,p) => s + p.monto, 0)) >= t.eco.totalCliente) {
        t.estado = "pagado";
      }
      guardarDemo(d);
      return t;
    }

    const { data: u } = await c.auth.getUser();
    await c.from("pagos").insert({
      trabajo_id:id, tipo, metodo:"yappy", monto, estado:"retenido"
    });
    const { data: pgs } = await c.from("pagos").select("monto").eq("trabajo_id", id);
    const suma = (pgs || []).reduce((s,p) => s + Number(p.monto), 0);
    if (suma >= t0.eco.totalCliente) {
      await c.from("trabajos").update({ estado:"pagado" }).eq("id", id);
    }
    return await this.trabajo(id);
  },

  // cuanto ha pagado ya el cliente
  async pagado(id) {
    const c = await cliente();
    if (!c) {
      const d = leerDemo();
      const t = d.trabajos.find(x => x.id === id);
      return (t?.pagos || []).reduce((s,p) => s + p.monto, 0);
    }
    const { data } = await c.from("pagos").select("monto").eq("trabajo_id", id);
    return (data || []).reduce((s,p) => s + Number(p.monto), 0);
  },

    await c.from("calificaciones").insert({
      trabajo_id:id, cliente_id:u, contratista_id:t?.contratistaId, estrellas, etiquetas

  async setDisponible(v) {
    const c = await cliente();
    if (!c) {
      const d = leerDemo();
      if (d.contratista) { d.contratista.disponible = !!v; guardarDemo(d); }
      return !!v;
    }
    const { data: u } = await c.auth.getUser();
    if (!u?.user) throw new Error("Se cerro tu sesion. Vuelve a entrar.");
    // Pedimos que nos devuelva la fila: si las reglas de la base no dejan
    // escribir, PostgREST contesta 204 sin tocar nada y el boton se quedaba
    // callado. Con return=representation se nota.
    const { data, error } = await c.from("contratistas")
      .update({ disponible: !!v }).eq("id", u.user.id).select("disponible");
    if (error) throw new Error(error.message);
    const filas = Array.isArray(data) ? data : (data ? [data] : []);
    if (!filas.length) throw new Error("No se pudo guardar tu disponibilidad. Avisale a Leo.");
    return !!filas[0].disponible;

  async descartarTrabajo(id) {

  // Cierra los pedidos que llevan mas de un dia sin que nadie los tome.
  // Se llama de vez en cuando, no en cada refresco: es barata pero no
  // gratis, y el resultado no cambia de un minuto a otro.
  async caducarViejos() {
    const c = await cliente();
    if (!c) return 0;
    const LLAVE_ULT = "mc2_ultima_caducada";
    try {
      const ult = Number(localStorage.getItem(LLAVE_ULT) || 0);
      if (Date.now() - ult < 3600000) return 0;      // una vez por hora basta
      localStorage.setItem(LLAVE_ULT, String(Date.now()));
    } catch (e) { /* sin almacenamiento, se llama y ya */ }
    try { return await pedirFuncion(c, "caducar_trabajos", {}); }
    catch (e) { anotarFalla("caducar trabajos viejos", e); return 0; }
  },

  // trabajos abiertos que le sirven a este contratista
  async trabajosCerca() {
    const c = await cliente();
    if (!c) {
      const d = leerDemo();
      const cats = d.contratista?.cats || [];
      const descartados = d.descartados || [];
      const limite = Date.now() - CONFIG.HORAS_CADUCA * 3600000;
      const propios = d.trabajos.filter(t => t.estado === "buscando");
      return [...d.pendientes, ...propios]
        .filter(t => !descartados.includes(t.id))
        .filter(t => !t.creado || new Date(t.creado).getTime() > limite)
        .filter(t => cats.length === 0 || cats.includes(t.categoria))
        .map(t => ({ ...t, servicioNombre: servicioPorId(t.servicioId)?.nombre || "Trabajo",
                     eco: economia(servicioPorId(t.servicioId)?.precio || 0,
                          { exento:!!servicioPorId(t.servicioId)?.exento,
                            nivel: d.contratista?.nivel || "bronce" }) }))
        .sort((a,b) => (b.urgencia === "emergencia") - (a.urgencia === "emergencia")
                     || (a.distancia || 0) - (b.distancia || 0));
    }
    // La lista la arma la base, no la pantalla: asi el filtro (mi
    // oficio, que este habilitado, que no sea viejo, que no lo haya
    // descartado) es el mismo aqui, en el reparto y en los avisos.
    try {
      const filas = await pedirFuncion(c, "trabajos_para_mi", { p_limite: 30 });
      return (filas || []).map(normalizar);
    } catch (e) {
      // Si todavia no corriste mc2_caducar.sql, la app sigue andando con
      // la consulta de antes en vez de quedarse en blanco.
      anotarFalla("lista de trabajos (usando la version vieja)", e);
      const { data: u } = await c.auth.getUser();
      const { data: cats } = await c.from("contratista_categorias")
        .select("categoria_id").eq("contratista_id", u.user.id);
      const ids = (cats || []).map(x => x.categoria_id);
      let q = c.from("trabajos").select("*").eq("estado","buscando").limit(30);
      if (ids.length) q = q.in("categoria_id", ids);
      const { data } = await q;
      return (data || []).map(normalizar);
    }
  },

  async aceptarTrabajo(id) {
    const c = await cliente();
    if (!c) {
      const d = leerDemo();
      const i = d.pendientes.findIndex(t => t.id === id);
      let t;
      if (i >= 0) { t = d.pendientes.splice(i, 1)[0]; d.trabajos.unshift(t); }
      else t = d.trabajos.find(x => x.id === id);
      if (!t) return null;
      const serv = servicioPorId(t.servicioId);
      const cn = d.contratista;
      t.estado = "asignado";
      t.contratistaId = cn?.id || "u_demo";
      t.contratista = { id:cn?.id, nombre:cn?.nombre || "Tu", rating:cn?.rating || 5,
                        trabajos:cn?.trabajos || 0, nivel:cn?.nivel || "oro" };
      t.servicioNombre = serv?.nombre || "Trabajo";
      t.eco = economia(serv?.precio || 0, { exento:!!serv?.exento, nivel:cn?.nivel || "oro" });
      guardarDemo(d);
      return t;
    }
    const { data: u } = await c.auth.getUser();
    // DOS COSAS QUE ESTABAN MAL AQUI Y COSTARON UNA TARDE.
    //
    // 1. No se miraba "error". Si la base rechazaba el cambio —y lo
    //    estaba rechazando siempre, por dos fallas en las reglas— aqui
    //    no se enteraba nadie: data llegaba vacio y la app concluia
    //    que otro tecnico se habia adelantado. Una mentira que mandaba
    //    a buscar el problema al lugar equivocado.
    //
    // 2. .single() REVIENTA cuando no vuelve ninguna fila. O sea que
    //    perder la carrera contra otro tecnico, que es lo normal y
    //    esperable, llegaba como si fuera una falla. .maybeSingle()
    //    devuelve null y ya.
    const { data, error } = await c.from("trabajos")
      .update({ contratista_id:u.user.id, estado:"asignado" })
      .eq("id", id).eq("estado","buscando").select().maybeSingle();
    if (error) throw new Error(error.message);

function llaveABytes(b64url) {
  const relleno = "=".repeat((4 - (b64url.length % 4)) % 4);
  const b64 = (b64url + relleno).replace(/-/g, "+").replace(/_/g, "/");
  const crudo = atob(b64);
  const bytes = new Uint8Array(crudo.length);
  for (let i = 0; i < crudo.length; i++) bytes[i] = crudo.charCodeAt(i);
  return bytes;
}

    try { permiso = await Notification.requestPermission(); }
    catch (err) { return { ok: false, motivo: "error" }; }
  }
  if (permiso !== "granted") return { ok: false, motivo: "rechazado" };

    const reg = await navigator.serviceWorker.ready;

  if (!iso) return "";
  const ms = new Date(iso) - new Date();
  if (ms <= 0) return "cerrada";
  const min = Math.round(ms / 60000);
  if (min < 60) return `${min} min`;
  const h = Math.floor(min / 60);
  return `${h} h ${min % 60} min`;
}

  if (m.includes("already registered") || m.includes("already been registered"))
    return "Ese telefono ya esta registrado. Intenta entrar.";

  if (m.includes("network") || m.includes("fetch"))

    return "El sistema rechazo el correo interno. Avisale a Leo: hay que cambiar el dominio.";

    <div class="cont vista">
      <div class="aviso aviso-azul" style="margin-bottom:16px">
        <div style="display:flex;gap:9px;margin-bottom:6px"><span>&#9989;</span>
          <span>Contratistas verificados con RUC, cedula y referencias</span></div>
        <div style="display:flex;gap:9px;margin-bottom:6px"><span>&#128179;</span>
          <span>Precio cerrado. Pagas seguro por la app</span></div>
        <div style="display:flex;gap:9px"><span>&#128737;</span>
          <span>Garantia MC2 de 7 dias</span></div>
      </div>

      <div id="err"></div>

      <div id="campos-registro">
        <label for="f-nombre">Tu nombre</label>
        <input id="f-nombre" type="text" placeholder="Leo Ortega" autocomplete="name">
      </div>

      <label for="f-tel">Tu celular</label>
      <input id="f-tel" type="tel" inputmode="numeric" placeholder="6123-4567" autocomplete="tel">

      <label for="f-clave">Crea una clave</label>
      <input id="f-clave" type="password" placeholder="Minimo 6 caracteres" autocomplete="current-password">

      <div style="height:18px"></div>
      <button class="btn btn-primario" id="b-entrar">Crear mi cuenta</button>
      <div style="height:10px"></div>
      <button class="btn btn-suave btn-chico" id="b-cambiar">Ya tengo cuenta, quiero entrar</button>

      <div style="display:flex;align-items:center;gap:10px;margin:20px 0 14px">
        <span style="flex:1;height:1px;background:var(--gris-3)"></span>
        <span style="font-size:11.5px;color:var(--gris-2)">o</span>
        <span style="flex:1;height:1px;background:var(--gris-3)"></span>
      </div>

      <button class="btn btn-linea" data-ir="c-registro">
        &#128296; Soy contratista, quiero trabajar
      </button>

      <p class="ayuda" style="text-align:center;margin-top:16px">
        Al continuar aceptas los terminos de servicio de MC2.
      </p>

      <div style="height:10px"></div>
      <button class="btn btn-suave btn-chico" id="b-diag"
        style="font-size:12px;color:var(--gris-2)">Probar conexion (version ${esc(CONFIG.VERSION)})</button>
      <div style="height:6px"></div>
      <button class="btn btn-suave btn-chico" id="b-autotest"
        style="font-size:12px;color:var(--gris-2)">Revisar las pantallas antes de mostrar la app</button>
      <pre id="diag" style="display:none;white-space:pre-wrap;font-size:11px;
        background:var(--gris-luz);padding:10px;border-radius:8px;margin-top:8px;
        line-height:1.5;overflow-x:auto"></pre>
    </div>`;

  function montar(el, { ir }) {
    let esRegistro = true;
    const $ = (id) => el.querySelector(id);
    const err = (m) => { $("#err").innerHTML = m ? `<div class="error-caja">${esc(m)}</div>` : ""; };

    $("#b-cambiar").onclick = () => {
      esRegistro = !esRegistro;
      $("#campos-registro").style.display = esRegistro ? "" : "none";
      $("#b-entrar").textContent = esRegistro ? "Crear mi cuenta" : "Entrar";
      $("#b-cambiar").textContent = esRegistro
        ? "Ya tengo cuenta, quiero entrar" : "Soy nuevo, quiero registrarme";
      $("#f-clave").previousElementSibling.textContent = esRegistro ? "Crea una clave" : "Tu clave";
      err("");
    };

    // Diagnostico: prueba cada paso por separado y muestra el resultado
    // en pantalla. Sirve para saber exactamente donde se rompe.
    // REVISAR LAS PANTALLAS ANTES DE ENSENARLE LA APP A ALGUIEN.
    //
    // Esto arma cada pantalla de la app con datos de mentira y comprueba
    // que se dibuja Y que sus botones quedan conectados. Es de 5
    // segundos y se corre en el celular de verdad, con el internet de
    // verdad.
    //
    // Existe por el 19 de agosto: una funcion que no estaba exportada
    // reventaba el codigo que enciende los botones del contratista. La
    // pantalla se veia perfecta y no respondia a nada, sin un solo
    // mensaje. Se descubrio con un contratista de verdad al frente.
    // Esta prueba lo habria cazado en cinco segundos.
    $("#b-autotest").onclick = async () => {
      const caja = $("#diag");
      caja.style.display = "block";
      caja.textContent = "Revisando las pantallas...\n\n";
      const r = await (window.MC2_revisar ? window.MC2_revisar() : Promise.resolve(null));
      if (!r) { caja.textContent = "No se pudo revisar. Avisale a Leo."; return; }

      const malas = r.filter(x => !x.ok);
      caja.textContent =
        `version ${CONFIG.VERSION}\n` +
        `${r.length - malas.length} de ${r.length} pantallas estan bien\n\n` +
        (malas.length
          ? "PANTALLAS CON PROBLEMA:\n\n" +
            malas.map(x => `  ${x.ruta}\n     ${x.msg}\n`).join("") +
            "\nNO le muestres la app a nadie asi. Mandale esta pantalla a Leo."
          : "Todo bien. Los botones de todas las pantallas responden.");
    };

    $("#b-diag").onclick = async () => {
      const caja = $("#diag");
      caja.style.display = "block";
      caja.textContent = "Probando...\n";
      const linea = (t) => { caja.textContent += t + "\n"; };
      const U = CONFIG.SUPABASE_URL, K = CONFIG.SUPABASE_ANON_KEY;

      linea("version: " + CONFIG.VERSION);
      linea("servidor: " + (U || "SIN CONFIGURAR"));
      linea("llave: " + (K ? K.slice(0, 12) + "..." : "SIN CONFIGURAR"));
      linea("");

      const probar = async (nombre, hacer) => {
        try {
          const r = await hacer();
          const cuerpo = (await r.text()).slice(0, 160);
          linea(`${nombre}: HTTP ${r.status}`);
          linea(`   ${cuerpo}`);
        } catch (e) {
          linea(`${nombre}: FALLO`);
          linea(`   ${e.name}: ${e.message}`);
        }
        linea("");
      };

      await probar("1. Leer sin cabeceras", () =>
        fetch(`${U}/rest/v1/categorias?select=nombre&apikey=${K}`));

      await probar("2. Leer con cabeceras", () =>
        fetch(`${U}/rest/v1/categorias?select=nombre`, { headers: { apikey: K } }));

      await probar("3. Consultar el registro", () =>
        fetch(`${U}/auth/v1/settings`, { headers: { apikey: K } }));

      const falso = "9" + Math.floor(1000000 + Math.random() * 8999999) + "@mc2.app";
      await probar("4. Crear usuario de prueba", () =>
        fetch(`${U}/auth/v1/signup`, {
          method: "POST",
          headers: { apikey: K, "Content-Type": "application/json" },
          body: JSON.stringify({ email: falso, password: "MC2diagnostico2026" })
        }));

      linea("--- fin. mandale esta pantalla a Claude ---");
    };

    $("#b-entrar").onclick = async () => {
      const nombre = $("#f-nombre").value.trim();
      const telefono = $("#f-tel").value.trim();
      const clave = $("#f-clave").value;
      if (esRegistro && nombre.length < 2) return err("Escribe tu nombre.");
      if (telefono.replace(/\D/g, "").length < 7) return err("Escribe un celular valido.");
      if (clave.length < 6) return err("La clave debe tener al menos 6 caracteres.");

      const b = $("#b-entrar");
      b.disabled = true; b.textContent = "Un momento...";
      try {
        const u = esRegistro
          ? await API.registrar({ nombre, telefono, clave, rol:"cliente" })
          : await API.entrar({ telefono, clave });
        ir(u && u.rol === "contratista" ? "c-trabajos" : "inicio", {}, u);
      } catch (e) {
        err(e.message || "Algo fallo.");
        b.disabled = false;
        b.textContent = esRegistro ? "Crear mi cuenta" : "Entrar";
      }
    };
  }
  return { html, montar };
}

      ${activo ? `
        <p class="seccion-tit" style="margin-top:18px">Tu trabajo en curso</p>
        <div class="tarjeta ${activoCotiz ? "destacada" : ""}" data-abrir="${activo.id}"
             data-cotiza="${enCotizacion(activo) ? 1 : 0}" style="cursor:pointer">
          <div class="item">
            <div>
              <p class="nom">${esc(activo.servicioNombre)}</p>
              <p class="det">${activoCotiz
                ? `<b style="color:var(--verde-osc)">${activoCotiz} precio${activoCotiz === 1 ? "" : "s"} esperando que escojas</b>`
                : enCotizacion(activo)
                  ? "Esperando precios de los tecnicos"
                  : esc(ESTADO_TXT[activo.estado] || activo.estado) +
                    (activo.contratista ? " &middot; " + esc(activo.contratista.nombre) : "")}</p>
            </div>
            <span style="font-size:20px;color:var(--gris-2)">&rsaquo;</span>
          </div>
        </div>` : ""}

      <div style="height:16px"></div>
      <div class="aviso aviso-verde">
        <b>&#128737; Garantia MC2 de 7 dias</b>
        Si el trabajo falla, mandamos otro tecnico sin costo.
      </div>
    </div>
    ${barra("inicio")}`;

  function montar(el, { ir, setZona }) {
    el.querySelectorAll("[data-cat]").forEach(b => {

    });
    const ab = el.querySelector("[data-abrir]");
    if (ab) ab.onclick = () => ir(ab.dataset.cotiza === "1" ? "cotizaciones" : "trabajo",
                                  { id: ab.dataset.abrir });
    el.querySelector("#b-emergencia").onclick = () => ir("catalogo", { cat:"plomeria", urgencia:"emergencia" });
    el.querySelector("#b-zona").onclick = () => {
      const i = CONFIG.ZONAS.indexOf(ctx.zona || CONFIG.ZONAS[0]);
      setZona(CONFIG.ZONAS[(i + 1) % CONFIG.ZONAS.length]);
    };
  }
  return { html, montar };
}

// ------------------------------------------------------------ 4. PEDIR
function vistaPedir(ctx) {
  const s = servicioPorId(ctx.params.servicioId);
  if (!s) return { html:`<div class="cont"><div class="vacio">Servicio no encontrado.</div></div>`, montar(){} };

  const esFijo = s.precio != null;
  const eco = esFijo ? economia(s.precio, { exento:!!s.exento, nivel:"oro" }) : null;

  const html = `
    ${cab("Confirmar pedido", { volver:"inicio", sub:s.nombre })}
    <div class="cont vista">
      <div id="err"></div>

      <p class="seccion-tit">Muestranos el dano ${esFijo ? "(opcional)" : ""}</p>
      <div class="foto-zona" id="zona-foto">
        <span class="ico">&#128247;</span>
        <span class="t">Tomar foto o elegir del celular</span>
        <span class="s">Ayuda al tecnico a llegar preparado</span>
      </div>
      <input type="file" id="f-foto" accept="image/*" capture="environment" style="display:none">
      <div id="previa"></div>

      <label>&iquest;Donde queda?</label>
      <button class="btn btn-azul btn-chico" id="b-ubicar">
        &#128205; Usar mi ubicacion</button>
      <div id="mapa" style="display:none;margin-top:10px"></div>
      <div id="est-ubi" class="ayuda" style="margin-top:6px"></div>

      <input id="f-dir" type="text" placeholder="PH Costa Bay, Costa del Este"
             value="${esc(ctx.zona || "")}" style="margin-top:10px">
      <p class="ayuda">Puedes corregir la direccion a mano si hace falta.</p>

      <label for="f-det">Torre, piso y apartamento o local</label>
      <input id="f-det" type="text" placeholder="Torre B, piso 14, apto 1402">
      <p class="ayuda">Esto es lo mas importante: el GPS llega al edificio,
        pero solo tu sabes el apartamento.</p>

      <label>Tipo de propiedad</label>
      <div class="opciones" id="ops-tipo">
        <button class="opcion" data-v="residencial">Residencial</button>
        <button class="opcion activa" data-v="ph">PH</button>
        <button class="opcion" data-v="comercial">Comercial</button>
      </div>

      <label>&iquest;Que tan urgente?</label>
      <div class="opciones" id="ops-urg">
        <button class="opcion ${ctx.params.urgencia === "normal" ? "activa" : ""}" data-v="normal">
          <span class="ico">&#128197;</span>Normal</button>
        <button class="opcion ${ctx.params.urgencia === "urgente" ? "activa" : ""}" data-v="urgente">
          <span class="ico">&#9200;</span>Urgente</button>
        <button class="opcion ${ctx.params.urgencia === "emergencia" ? "activa" : ""}" data-v="emergencia">
          <span class="ico">&#9888;&#65039;</span>Emergencia</button>
      </div>

      <label for="f-desc">Cuentanos mas (opcional)</label>
      <textarea id="f-desc" placeholder="El agua sale por debajo del gabinete desde ayer"></textarea>

      <div id="caja-precio"></div>

      <button class="btn btn-primario" id="b-pedir">Pedir precios</button>
      <p class="ayuda" style="text-align:center" id="txt-pedir"></p>
    </div>`;

  function montar(el, { ir }) {
    const $ = (q) => el.querySelector(q);
    const err = (m) => { $("#err").innerHTML = m ? `<div class="error-caja">${esc(m)}</div>` : ""; };
    let foto = null;
    let tipo = "ph";
    let urg = ctx.params.urgencia || "normal";
    let lat = null, lng = null;

    // ---- Ubicacion por GPS ----
    // El mapa se muestra con OpenStreetMap incrustado: es gratis, no pide
    // llave de nadie y no nos amarra a ningun proveedor de pago.
    const pintarMapa = (la, lo) => {
      const d = 0.0035;
      const caja = [lo - d, la - d, lo + d, la + d].join("%2C");
      $("#mapa").style.display = "block";
      $("#mapa").innerHTML =
        `<iframe title="Mapa de la ubicacion" style="width:100%;height:180px;border:0;
          border-radius:var(--r-g)" loading="lazy"
          src="https://www.openstreetmap.org/export/embed.html?bbox=${caja}&layer=mapnik&marker=${la}%2C${lo}"></iframe>`;
    };

    $("#b-ubicar").onclick = () => {
      const b = $("#b-ubicar");
      const est = $("#est-ubi");
      if (!navigator.geolocation) {
        est.textContent = "Tu celular no permite ubicacion. Escribe la direccion a mano.";
        return;
      }
      b.disabled = true; b.textContent = "Buscando tu ubicacion...";
      est.textContent = "";

      navigator.geolocation.getCurrentPosition(async (pos) => {
        lat = pos.coords.latitude; lng = pos.coords.longitude;
        pintarMapa(lat, lng);
        b.disabled = false; b.textContent = "\u{1F4CD} Actualizar mi ubicacion";
        est.textContent = "Ubicacion tomada. Revisa el mapa.";

        // Intentamos traducir las coordenadas a una direccion legible.
        // Si el servicio no responde, no pasa nada: las coordenadas ya
        // quedaron guardadas y son lo que de verdad le sirve al tecnico.
        try {
          const r = await fetch(
            `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&accept-language=es`);
          if (r.ok) {
            const j = await r.json();
            if (j.display_name && !$("#f-dir").dataset.tocado) {
              $("#f-dir").value = j.display_name.split(",").slice(0, 3).join(",").trim();
            }
          }
        } catch (e) { /* seguimos con las coordenadas */ }
      }, (err) => {
        b.disabled = false; b.textContent = "\u{1F4CD} Usar mi ubicacion";
        est.textContent = err.code === 1
          ? "No diste permiso de ubicacion. Puedes escribir la direccion a mano."
          : "No pudimos tomar tu ubicacion. Escribe la direccion a mano.";
      }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
    };

    // Si el cliente corrige la direccion, no se la volvemos a pisar.
    $("#f-dir").oninput = () => { $("#f-dir").dataset.tocado = "1"; };

    $("#zona-foto").onclick = () => $("#f-foto").click();
    $("#f-foto").onchange = (e) => {
      const f = e.target.files?.[0];
      if (!f) return;
      if (f.size > 6 * 1024 * 1024) return err("La foto pesa mucho. Toma una mas liviana.");
      const lector = new FileReader();
      lector.onload = () => {
        foto = lector.result;
        $("#previa").innerHTML = `<img class="foto-previa" src="${esc(foto)}" alt="Foto del dano">`;
        $("#zona-foto").style.display = "none";
        err("");
      };
      lector.readAsDataURL(f);
    };

    const grupo = (sel, set) => {
      el.querySelectorAll(`${sel} .opcion`).forEach(b => {
        b.onclick = () => {
          el.querySelectorAll(`${sel} .opcion`).forEach(x => x.classList.remove("activa"));
          b.classList.add("activa");
          set(b.dataset.v);
        };
      });
    };
    // ---- El precio se pinta segun la urgencia ----
    //
    // Normal y urgente van a cotizacion: el cliente ve un RANGO de
    // referencia, no un precio inventado, y el precio de verdad se lo
    // ponen los contratistas.
    //
    // Emergencia sigue con precio cerrado, porque ahi lo que importa es
    // que alguien salga ya.
    const rango = s.rango
      ? s.rango
      : (s.precio ? [Math.round(s.precio * 0.7), Math.round(s.precio * 1.3)] : null);

    function pintarPrecio() {
      const caja = $("#caja-precio");
      const esEmergencia = urg === "emergencia";

      if (esEmergencia && esFijo) {
        caja.innerHTML = `
          <div class="dinero">
            <div class="l"><span>${esc(s.nombre)}</span><span>${money(eco.base)}</span></div>
            <div class="l"><span>Garantia MC2 de 7 dias</span><span>${eco.tarifa ? money(eco.tarifa) : "Incluida"}</span></div>
            <div class="l total"><span>Total</span><span>${money(eco.totalCliente)}</span></div>
            <div class="l" style="font-size:12px;padding-top:8px">
              <span>${eco.anticipo <= 0
                ? "No pagas nada ahora. Pagas cuando el trabajo este listo."
                : eco.saldo <= 0
                  ? `Pagas ${money(eco.anticipo)} al confirmar. MC2 te lo retiene hasta que apruebes.`
                  : `Pagas hoy ${money(eco.anticipo)} &middot; al terminar ${money(eco.saldo)}`}</span></div>
          </div>`;
        $("#b-pedir").textContent = "Pedir tecnico ahora";
        $("#txt-pedir").textContent = "Emergencia: te mandamos al tecnico mas cercano, sin esperar precios.";
        return;
      }

      caja.innerHTML = `
        <div class="aviso aviso-azul" style="margin-top:14px">
          <b>&#128176; Los tecnicos te mandan su precio</b>
          ${rango ? `Trabajos parecidos andan entre ${CONFIG.MONEDA} ${rango[0]} y
                     ${CONFIG.MONEDA} ${rango[1]}. Es solo una referencia:
                     el precio te lo pone el tecnico despues de ver tu foto.`
                  : "Cada tecnico te manda su precio despues de ver tu foto."}
        </div>
        <div class="aviso" style="margin-top:10px;background:var(--gris-luz)">
          <b>&#9201; Tienes ${CONFIG.HORAS_COTIZACION} horas para comparar</b>
          Te van llegando los precios y tu escoges. Ves la calificacion de
          cada uno y a que hora puede llegar. No pagas nada por pedirlos.
        </div>`;
      $("#b-pedir").textContent = "Pedir precios a los tecnicos";
      $("#txt-pedir").textContent = "Escoges tu. Si ninguno te convence, no pasa nada.";
    }

    grupo("#ops-tipo", v => tipo = v);
    grupo("#ops-urg",  v => { urg = v; pintarPrecio(); });
    pintarPrecio();

    $("#b-pedir").onclick = async () => {
      const direccion = $("#f-dir").value.trim();
      if (direccion.length < 4) return err("Escribe la direccion.");
      const b = $("#b-pedir");
      const textoBoton = b.textContent;
      const porCotizar = urg !== "emergencia";
      b.disabled = true;
      b.textContent = porCotizar ? "Avisando a los tecnicos..." : "Buscando tecnico...";
      try {
        const t = await API.crearTrabajo({
          servicioId: s.id, categoria: s.cat, tipoPropiedad: tipo, urgencia: urg,
          direccion, detalle: $("#f-det").value.trim(),
          descripcion: $("#f-desc").value.trim(), foto, lat, lng
        });
        ir(enCotizacion(t) ? "cotizaciones" : "trabajo", { id: t.id });
      } catch (e) {
        err(e.message || "No se pudo crear el pedido.");
        b.disabled = false; b.textContent = textoBoton;
      }
    };
  }
  return { html, montar };
}

// ------------------------------------------- 4b. COMPARAR COTIZACIONES
//
//  La pantalla donde el cliente escoge. Regla de diseno: el precio nunca
//  va solo. Al lado siempre estan la calificacion, cuantos trabajos
//  lleva y a que hora puede llegar. Un marketplace que solo ensena el
//  precio termina siendo una lista de los mas baratos, y de ahi no se
//  vuelve.
function vistaCotizaciones(ctx) {
  const t = ctx.trabajo;

    <div class="cont"><div class="vacio">No encontramos ese trabajo.</div></div>`, montar(){} };

  const cerrada = t.cotizaHasta && new Date(t.cotizaHasta) <= new Date();
  const barato = lista.length ? Math.min(...lista.map(q => q.total)) : 0;

  const tarjeta = (q) => `
    <div class="tarjeta ${q.total === barato && lista.length > 1 ? "destacada" : ""}">
      <div class="item">
        <div style="flex:1">

        </div>
        <div style="text-align:right">
          <div class="precio">${money(q.total)}</div>
          <div class="neto">${q.tarifa ? "incluye garantia " + money(q.tarifa) : "garantia incluida"}</div>
        </div>
      </div>
      ${q.mensaje ? `<p class="det" style="margin-top:8px;font-style:italic">
        &ldquo;${esc(q.mensaje)}&rdquo;</p>` : ""}
      <div style="height:9px"></div>
      <button class="btn btn-primario btn-chico" data-elegir="${q.id}"
        data-nombre="${esc(q.nombre)}" data-total="${q.total}">
        Escoger a ${esc((q.nombre || "").split(" ")[0])}
      </button>
    </div>`;

  const html = `
    ${cab("Escoge tu tecnico", { volver:"trabajos", sub:t.servicioNombre || "" })}
    <div class="cont vista">
      <div id="err"></div>

      ${cerrada ? `
        <div class="aviso aviso-naranja">
          <b>Se cerro el plazo de precios</b>
          ${lista.length
            ? "Igual puedes escoger entre los que llegaron."
            : "No llego ninguno. Pidelo otra vez o llamanos y te conseguimos un tecnico."}
        </div>` : `
        <div class="aviso aviso-azul">
          <b>&#9201; Quedan ${esc(faltaPara(t.cotizaHasta))} para recibir precios</b>
          Puedes escoger apenas te llegue uno que te guste. No tienes que esperar.
        </div>`}

      ${rango && rango.max ? `
        <p class="ayuda" style="margin-bottom:10px">
          De referencia, trabajos parecidos andan entre ${CONFIG.MONEDA} ${rango.min}
          y ${CONFIG.MONEDA} ${rango.max}${rango.muestras >= 5
            ? ` (${rango.muestras} trabajos hechos en MC2)` : ""}.
        </p>` : ""}

      <p class="seccion-tit">${lista.length
        ? `${lista.length} precio${lista.length === 1 ? "" : "s"} ${lista.length === 1 ? "recibido" : "recibidos"}`
        : "Todavia no llega ninguno"}</p>

      ${lista.length ? lista.map(tarjeta).join("") : `
        <div class="vacio">
          <span class="ico">&#9203;</span>
          Los tecnicos de tu zona ya vieron tu pedido.
          <div style="font-size:12.5px;margin-top:8px">
            Te avisamos apenas llegue el primer precio. Puedes cerrar la app.
          </div>
        </div>`}

      <div style="height:10px"></div>
      <button class="btn btn-suave btn-chico" data-ir="trabajo">Ver el detalle de mi pedido</button>
    </div>
    ${barra("trabajos")}`;

  function montar(el, { ir, recargar }) {
    const err = (m) => {
      const c = el.querySelector("#err");
      if (c) c.innerHTML = m ? `<div class="error-caja">${esc(m)}</div>` : "";
    };

    el.querySelectorAll("[data-elegir]").forEach(b => {
      b.onclick = async () => {
        // Escoger asigna el trabajo y congela el precio: vale la pena
        // preguntar una vez, aunque estorbe.
        const ok = confirm(
          `Vas a escoger a ${b.dataset.nombre} por ${money(Number(b.dataset.total))}.\n\n` +
          `Los demas precios se descartan. ¿Seguimos?`);
        if (!ok) return;
        el.querySelectorAll("[data-elegir]").forEach(x => x.disabled = true);
        b.textContent = "Asignando...";
        try {

          el.querySelectorAll("[data-elegir]").forEach(x => x.disabled = false);
          b.textContent = "Escoger";
          err(e.message || "No se pudo asignar. Intenta de nuevo.");
        }
      };
    });

    const ver = el.querySelector('[data-ir="trabajo"]');
    if (ver) ver.onclick = () => ir("trabajo", { id: t.id });
  }
  return { html, montar };
}

// "hoy a las 3:00 p.m." dice mas que una fecha completa.
function cuando(iso) {
  if (!iso) return "por confirmar";
  const d = new Date(iso);
  const hoy = new Date();
  const manana = new Date(hoy.getTime() + 86400000);
  const hora = d.toLocaleTimeString("es-PA", { hour:"numeric", minute:"2-digit" });
  const mismoDia = (a, b) => a.toDateString() === b.toDateString();
  if (mismoDia(d, hoy)) return `hoy a las ${hora}`;
  if (mismoDia(d, manana)) return `manana a las ${hora}`;
  return d.toLocaleDateString("es-PA", { weekday:"long", day:"numeric", month:"short" }) + ` a las ${hora}`;
}

        <button class="btn btn-primario btn-chico" id="b-ver-cotiz">Ver los precios</button>
      </div>` : t.estado === "buscando" ? `

      <div class="tarjeta">
        <p class="nom">&#9989; Ya tienes tecnico asignado</p>
        <p class="det">Estamos cargando sus datos. Si no aparecen, recarga la pantalla.</p>

      ${["buscando","asignado","en_camino"].includes(t.estado) ? `

  }
  return { html, montar };

  // UN TRABAJO A COTIZAR NO CUESTA "B/. 0.00".

  // precios el total es cero. Quedaba "B/. 0.00 - Buscando tecnico",
  // que es justo lo contrario de lo que pasa: ya te llegaron precios y
  // te estan esperando. Aqui se dice cuantos hay y se entra directo a
  // escogerlos. (19 ago 2026)
  const tarjeta = (t) => {
    const cotiza = enCotizacion(t);
    const n = cotiza ? (cuantas[t.id] || 0) : 0;
    return `
      <div class="tarjeta ${n ? "destacada" : ""}" data-abrir="${t.id}"

                cotiza
                  ? (n ? `${n} precio${n === 1 ? "" : "s"} para escoger`
                       : "Esperando precios")
                  : esc(ESTADO_TXT[t.estado] || t.estado)}</span>
            </div>
          </div>
          <div class="precio" style="font-size:${cotiza ? "13px" : "17px"}">${
            cotiza
              ? (n ? "Ver precios &rarr;" : "&mdash;")
              : money(t.eco?.totalCliente)}</div>
        </div>
      </div>`;
  };

  const html = `
    ${cab("Mis trabajos")}
    <div class="cont vista">
      ${lista.length ? lista.map(tarjeta).join("") : `
        <div class="vacio">
          <span class="ico">&#128203;</span>

          <button class="btn btn-primario btn-chico" data-ir="inicio"
            style="max-width:220px;margin:0 auto">Pedir mi primer trabajo</button>
        </div>`}

    ${barra("trabajos")}`;

  function montar(el, { ir }) {
    el.querySelectorAll("[data-abrir]").forEach(d => {
      // Si esta esperando precios, la lista lleva DIRECTO a escogerlos.

      d.onclick = () => ir(d.dataset.cotiza === "1" ? "cotizaciones" : "trabajo",
                           { id: d.dataset.abrir });
    });
  }
  return { html, montar };
}

function iniciales(n) {
  return String(n).trim().split(/\s+/).slice(0, 2).map(p => p[0] || "").join("").toUpperCase();
}
function fecha(iso) {
  try {
    return new Date(iso).toLocaleDateString("es-PA", { day:"2-digit", month:"short" });
  } catch (e) { return ""; }
}
function etiqueta(estado) {
  if (["pagado","calificado"].includes(estado)) return "et-verde";
  if (estado === "buscando") return "et-gris";
  if (estado === "cancelado") return "et-roja";
  return "et-naranja";
}

return { esc, cuando, vistaEntrada, vistaInicio, vistaCatalogo, vistaPedir, vistaTrabajo, vistaTrabajos, vistaPerfil, vistaCotizaciones };

const cab = (titulo, { volver = null, sub = null } = {}) => `

// Le dice al contratista la verdad sobre el estado del pago del cliente.
// Nunca le decimos que le pagaron si no le han pagado.
function avisoPago(t, eco) {
  const pagado = (t.pagos || []).reduce((s, p) => s + (p.monto || 0), 0);
  if (pagado >= eco.totalCliente) {
    return `<div class="aviso aviso-verde" style="margin-top:10px">
      <b>&#9989; El cliente ya pago todo</b>
      MC2 tiene la plata retenida. Te cae a tu Yappy al dia siguiente de cerrar.</div>`;
  }
  if (pagado > 0) {
    return `<div class="aviso aviso-verde" style="margin-top:10px">
      <b>&#9989; El cliente ya adelanto ${money(pagado)}</b>
      MC2 se la retiene. El resto lo paga al terminar.</div>`;
  }
  return `<div class="aviso aviso-naranja" style="margin-top:10px">
    <b>&#9888;&#65039; Este cliente paga al terminar</b>
    Todavia no ha pagado nada. Sube la foto del despues antes de irte:
    es tu respaldo si hay algun problema con el cobro.</div>`;
}

function haceRato(iso) {
  try {
    const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (m < 1) return "ahora";
    if (m < 60) return `hace ${m} min`;
    const h = Math.round(m / 60);
    if (h < 24) return `hace ${h} h`;
    return `hace ${Math.round(h / 24)} d`;
  } catch (e) { return ""; }
}

      <label>&iquest;En que trabajas? Puedes elegir varias</label>
      <div class="rejilla" id="g-cats" style="grid-template-columns:repeat(3,1fr)">
        ${CATEGORIAS.map(c => `
          <button class="serv" data-cat="${c.id}" style="background:var(--gris-luz)">
            <span class="ico">${c.ico}</span>
            <span class="txt" style="color:var(--gris)">${esc(c.nombre)}</span>
          </button>`).join("")}
      </div>

      <label for="g-clave">Crea una clave</label>
      <input id="g-clave" type="password" placeholder="Minimo 6 caracteres">

      <div style="height:16px"></div>
      <button class="btn btn-primario" id="g-crear">Registrarme como contratista</button>

      <div class="aviso aviso-azul" style="margin-top:16px">
        <b>&#128203; Lo que falta despues del registro</b>
        Para quedar verificado te vamos a pedir foto de la cedula, tu poliza de
        seguro y dos referencias de clientes que podamos llamar. Mientras tanto
        puedes ver los trabajos disponibles.
      </div>
    </div>`;

  function montar(el, { ir }) {
    const $ = (q) => el.querySelector(q);
    const err = (m) => { $("#err").innerHTML = m ? `<div class="error-caja">${esc(m)}</div>` : ""; };
    const cats = new Set();

    el.querySelectorAll("#g-cats [data-cat]").forEach(b => {
      b.onclick = () => {
        const id = b.dataset.cat;
        if (cats.has(id)) {
          cats.delete(id);
          b.style.background = "var(--gris-luz)";
          b.querySelector(".txt").style.color = "var(--gris)";
        } else {
          cats.add(id);
          b.style.background = "var(--azul-luz)";
          b.querySelector(".txt").style.color = "var(--azul)";
        }
      };
    });

    $("#g-crear").onclick = async () => {
      const nombre = $("#g-nombre").value.trim();
      const telefono = $("#g-tel").value.trim();
      const cedula = $("#g-ced").value.trim();
      const clave = $("#g-clave").value;
      if (nombre.length < 3) return err("Escribe tu nombre completo.");
      if (telefono.replace(/\D/g,"").length < 7) return err("Escribe un celular valido.");
      if (cedula.length < 4) return err("Escribe tu numero de cedula.");
      if (cats.size === 0) return err("Elige al menos un tipo de trabajo.");
      if (clave.length < 6) return err("La clave debe tener al menos 6 caracteres.");

      const b = $("#g-crear");
      b.disabled = true; b.textContent = "Registrando...";
      try {
        const u = await API.registrar({
          nombre, telefono, clave, rol:"contratista",
          cedula, ruc:$("#g-ruc").value.trim(), cats:[...cats]
        });
        ir("c-trabajos", {}, u);
      } catch (e) {
        err(e.message || "Algo fallo.");
        b.disabled = false; b.textContent = "Registrarme como contratista";
      }
    };
  }
  return { html, montar };
}

  const bill = ctx.billetera || { semana:0, trabajosSemana:0 };
  const lista = ctx.cerca || [];
  const activos = (ctx.misTrabajos || []).filter(t =>
    ["asignado","en_camino","trabajando"].includes(t.estado));

  const html = `
    <div class="cab">
      <div class="cab-fila">
        <div style="width:38px;height:38px;border-radius:50%;background:var(--azul-2);
             display:flex;align-items:center;justify-content:center;font-weight:700;
             font-size:13px">${esc(iniciales(p.nombre))}</div>
        <div style="flex:1">
          <h1 style="font-size:15px">${esc(p.nombre || "Contratista")}</h1>

        </button>
      </div>
      <div style="margin-top:11px;background:var(--azul-2);border-radius:10px;
           padding:9px 12px;display:flex;justify-content:space-between">
        <div><div style="font-size:10.5px;color:#85B7EB">Esta semana</div>
          <div style="font-size:16px;font-weight:700">${money(bill.semana)}</div></div>
        <div style="text-align:right"><div style="font-size:10.5px;color:#85B7EB">Trabajos</div>
          <div style="font-size:16px;font-weight:700">${bill.trabajosSemana}</div></div>
      </div>
    </div>
    <div class="cont vista">
      <div id="caja-avisos"></div>

      ${activos.length ? `
        <p class="seccion-tit">En curso</p>

      ${!p.disponible ? `
        <div class="aviso aviso-naranja">
          <b>Estas en No disponible</b>

        </div>` : ""}

      <p class="seccion-tit">${lista.length} trabajo${lista.length === 1 ? "" : "s"} cerca de ti</p>

      ${lista.length ? lista.map(t => tarjetaTrabajo(t, false)).join("") : `
        <div class="vacio">
          <span class="ico">&#128269;</span>
          No hay trabajos disponibles en tu zona ahorita.
          <div style="font-size:12.5px;margin-top:8px">${estadoAvisos().estado === "activo"
            ? "Te suena el celular apenas entre uno."
            : "Activa los avisos arriba para que te suene el celular."}</div>
        </div>`}
    </div>
    ${barra("cerca")}`;

  function tarjetaTrabajo(t, enCurso) {
    const serv = servicioPorId(t.servicioId);
    const eco = t.eco || economia(serv?.precio || 0, { exento:!!serv?.exento, nivel:p.nivel });
    const cotiza = !enCurso && enCotizacion(t);
    const mia = cotiza ? (ctx.misCotiz || {})[t.id] : null;
    return `
      <div class="tarjeta ${t.urgencia === "emergencia" && !enCurso ? "destacada" : ""}"
           data-abrir="${t.id}" style="cursor:pointer">
        <div class="item">
          <div style="flex:1">
            ${enCurso ? `<span class="etiqueta et-azul">${esc(ESTADO_TXT[t.estado])}</span>`
                      : etUrgencia(t.urgencia)}
            <p class="nom" style="margin-top:6px">${esc(t.servicioNombre || serv?.nombre || "Trabajo")}</p>
            <p class="det">${esc(t.direccion)}</p>
            <p class="det">${t.distancia ? t.distancia + " km &middot; " : ""}${esc(haceRato(t.creado))}</p>
          </div>
          <div style="text-align:right">
            ${cotiza ? `
              <div class="precio" style="font-size:14px">${mia
                ? CONFIG.MONEDA + " " + mia.precio
                : "Tu pones<br>el precio"}</div>
              <div class="neto">${mia ? "tu precio" : "a cotizar"}</div>`
            : `
              <div class="precio">${CONFIG.MONEDA} ${eco.base}</div>
              <div class="neto">recibes ${eco.netoContratista.toFixed(2)}</div>`}
          </div>
        </div>
        ${enCurso ? "" : cotiza ? `<div style="height:9px"></div>
          <button class="btn ${mia ? "btn-suave" : "btn-primario"} btn-chico" data-cotizar="${t.id}">

        : `<div style="height:9px"></div>
          <button class="btn btn-azul btn-chico" data-aceptar="${t.id}">Aceptar trabajo</button>`}
        ${enCurso || mia ? "" : `
          <div style="height:7px"></div>
          <button class="btn btn-suave btn-chico" data-descartar="${t.id}"
            style="font-size:12px;color:var(--gris-2)">No me interesa</button>`}
      </div>`;

    // La caja de avisos es lo menos importante de esta pantalla, asi que va
    // envuelta y de ultima intencion: si falla, que no se lleve por delante
    // los botones, que es lo que le pasaba al contratista.
    const avisos = () => { try { pintarCajaAvisos(el); } catch (e) { anotarFalla("caja de avisos", e); } };

    el.querySelectorAll("[data-abrir]").forEach(d => {
      d.onclick = () => ir("c-trabajo", { id: d.dataset.abrir });
    });
    el.querySelectorAll("[data-descartar]").forEach(b => {

        ev.stopPropagation();
        b.disabled = true; b.textContent = "Quitando...";
        try {
          await API.descartarTrabajo(b.dataset.descartar);
          recargar();
        } catch (e) {
          b.disabled = false; b.textContent = "No me interesa";
          alert(e && e.message ? e.message : "No se pudo quitar de tu lista.");
        }
      };
    });
    el.querySelectorAll("[data-cotizar]").forEach(b => {
      b.onclick = (ev) => {
        ev.stopPropagation();
        ir("c-trabajo", { id: b.dataset.cotizar });
      };
    });
    el.querySelectorAll("[data-aceptar]").forEach(b => {
      b.onclick = async (ev) => {
        ev.stopPropagation();
        b.disabled = true; b.textContent = "Aceptando...";
        try {
          const t = await API.aceptarTrabajo(b.dataset.aceptar);
          if (t) ir("c-trabajo", { id: t.id });
          else { b.disabled = false; b.textContent = "Ya lo tomo otro tecnico"; }
        } catch (e) {
          b.disabled = false; b.textContent = "Aceptar trabajo";
          alert(e && e.message ? e.message : "No se pudo aceptar. Intenta de nuevo.");
        }
      };
    });
    const bDisp = el.querySelector("#b-disp");
    if (bDisp) bDisp.onclick = async () => {
      const quiere = !p.disponible;
      const antes = bDisp.textContent;
      bDisp.disabled = true; bDisp.textContent = quiere ? "Activando..." : "Apagando...";
      try {
        // Antes esto no miraba el resultado: si la base de datos decia que no,
        // el boton se quedaba igual y nadie se enteraba de por que.
        await API.setDisponible(quiere);
        recargar();
      } catch (e) {
        bDisp.disabled = false; bDisp.textContent = antes;
        alert(e && e.message ? e.message : "No se pudo cambiar tu disponibilidad.");
      }
    };

    avisos();
  }
  return { html, montar };
}

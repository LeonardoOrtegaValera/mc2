//  compara una FIRMA (un resumen de lo que importa). Si nada cambio, no
//  toca la pantalla: nada de parpadeos ni de perder lo que el usuario
//  estaba escribiendo. Si cambio, repinta.
//
//  Y se apaga cuando el celular se guarda en el bolsillo. Al volver a
//  abrirlo, refresca de una en vez de esperar el proximo turno.
// ---------------------------------------------------------------------
const RUTAS_VIVAS = ["inicio", "trabajos", "trabajo", "cotizaciones",
                     "c-trabajos", "c-trabajo", "p-cola"];
let refresco = null;
let refrescando = false;

// Solo lo que se ve en pantalla y puede cambiar del otro lado.
function firmaDelEstado() {
  const t = (x) => x ? [x.id, x.estado, x.contratistaId, x.modalidad,
                        x.eco && x.eco.base].join("~") : "";
  return JSON.stringify({
    trabajos: (estado.trabajos || []).map(t),
    mios: (estado.misTrabajos || []).map(t),
    cerca: (estado.cerca || []).map(t),
    uno: t(estado.trabajo),
    cotiz: (estado.cotizaciones || []).map(q => [q.id, q.precio, q.elegida].join("~")),
    conteo: estado.conteoCotiz || {},
    mias: estado.misCotiz || {},
    disp: estado.contratista && estado.contratista.disponible,
    cola: (estado.cola || []).length
  });
}

function pararRefresco() {
  if (refresco) { clearInterval(refresco); refresco = null; }
}

function arrancarRefresco() {
  pararRefresco();
  if (!RUTAS_VIVAS.includes(estado.ruta)) return;
  if (!CONFIG.SEGUNDOS_REFRESCO) return;
  refresco = setInterval(mirarSiCambio, CONFIG.SEGUNDOS_REFRESCO * 1000);
}

async function mirarSiCambio() {
  if (refrescando) return;                 // no encimar dos consultas
  if (document.hidden) return;             // en el bolsillo no se gasta nada
  if (!RUTAS_VIVAS.includes(estado.ruta)) return;
  // Si el usuario esta escribiendo, no le movemos la pantalla debajo.
  const foco = document.activeElement;
  if (foco && ["INPUT", "TEXTAREA", "SELECT"].includes(foco.tagName)) return;

  refrescando = true;
  try {
    const antes = firmaDelEstado();
    await cargarDatos();
    if (firmaDelEstado() !== antes) await render(false);
  } catch (e) {
    // Un refresco que falla no molesta a nadie: se intenta al proximo
    // turno. Queda anotado para la revision de pantallas.
    anotarFalla("refresco automatico", e);
  } finally {
    refrescando = false;
  }
}

document.addEventListener("visibilitychange", () => {
  if (document.hidden) { pararRefresco(); return; }
  arrancarRefresco();
  mirarSiCambio();          // al volver, al dia de una
});

// El aviso rojo de arriba. Dice que fallo, en que pantalla, y deja
// recargar sin cerrar sesion.
function avisarFalla(e, ruta) {
  try {
    const previo = document.getElementById("mc2-falla");
    if (previo) previo.remove();
    const d = document.createElement("div");
    d.id = "mc2-falla";
    d.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:9999;background:#E24B4A;" +
      "color:#fff;padding:10px 14px;font-size:13px;line-height:1.4";
    d.innerHTML =
      `<b>Esta pantalla no cargo bien.</b><br>` +
      `Algunos botones pueden no responder. Toca aqui para reintentar.` +
      `<div style="font-size:11px;opacity:.85;margin-top:4px">${ruta}: ${
        String(e && e.message || e).slice(0, 120)}</div>`;
    d.onclick = () => location.reload();
    document.body.appendChild(d);
  } catch (x) { /* si ni esto se puede, ya no hay nada que hacer */ }
}

// Cualquier error suelto de la app tambien se ve.
window.addEventListener("error", (ev) => {
  if (ev && ev.message && /Script error/i.test(ev.message)) return;  // ruido de otros dominios
  avisarFalla(ev.error || { message: ev.message }, estado.ruta);
});
window.addEventListener("unhandledrejection", (ev) => {
  avisarFalla(ev.reason || { message: "promesa sin atender" }, estado.ruta);
});

// ---------------------------------------------------------------------
//  REVISION DE PANTALLAS  (el boton de la pantalla de entrada)
//
//  Arma CADA pantalla con datos de mentira y la monta de verdad en un
//  contenedor escondido. Si el codigo que enciende los botones revienta,
//  aqui revienta tambien, y se ve el nombre de la pantalla y el error.
//
//  Corre en el celular del contratista, con su navegador y su internet.
//  Eso es lo que ninguna prueba mia en otra maquina puede garantizar.
// ---------------------------------------------------------------------
function estadoDePrueba() {
  const hoy = new Date().toISOString();
  const enDosHoras = new Date(Date.now() + 7200000).toISOString();
  const trabajo = {
    id:"prueba-1", folio:"MC2-PRUEBA", servicioId:null, servicioNombre:"Trabajo de prueba",
    categoria:"plomeria", tipoPropiedad:"ph", urgencia:"normal",
    direccion:"Calle de prueba", detalle:"Piso 1", descripcion:"Prueba interna",
    estado:"buscando", contratistaId:null, contratista:null,
    modalidad:"cotizacion", cotizaHasta:enDosHoras,
    eco:{ base:50, tarifa:5, totalCliente:55, comision:4, comisionPct:8,
          netoContratista:46, anticipo:0, saldo:55 },
    pagos:[], creado:hoy, calificacion:null
  };
  const cotizacion = {
    id:"cot-1", contratistaId:"c1", nombre:"Tecnico de prueba", rating:4.8,
    trabajos:20, nivel:"oro", verificado:true, precio:50, tarifa:5, total:55,
    llegada:enDosHoras, mensaje:"Prueba", elegida:false, creada:hoy
  };
  return {
    ruta:"inicio", params:{ id:"prueba-1", servicioId:null },
    usuario:{ id:"u", nombre:"Usuario Prueba", telefono:"60000000", rol:"cliente" },
    contratista:{ id:"u", nombre:"Tecnico Prueba", telefono:"60000000", cedula:"8-1-1",
                  cats:["plomeria"], rating:0, trabajos:0, nivel:"oro", esFundador:true,
                  disponible:true, saldo:0, transito:0,
                  ver:{ cedula:true, ruc:false, seguro:false, referencias:false, prueba:false } },
    trabajos:[trabajo], misTrabajos:[trabajo], cerca:[trabajo], trabajo,
    cotizaciones:[cotizacion], miCotizacion:null, misCotiz:{}, conteoCotiz:{ "prueba-1":1 },
    rango:{ min:30, max:80, muestras:0 },
    billetera:{ disponible:0, transito:0, semana:0, trabajosSemana:0 },
    cola:[], retiros:[], zona:CONFIG.ZONAS[0]
  };
}

window.MC2_revisar = async function () {
  const res = [];
  const caja = document.createElement("div");
  caja.style.cssText = "position:absolute;left:-99999px;top:0;width:390px";
  document.body.appendChild(caja);

  const nada = () => {};
  const ayudas = { ir:nada, recargar:nada, salir:async () => {}, setZona:nada };

  for (const ruta of Object.keys(VISTAS)) {
    const est = estadoDePrueba();
    est.ruta = ruta;
    try { window.__MC2_FALLAS.length = 0; } catch (e) { /* nada */ }
    try {
      const v = VISTAS[ruta](est);
      caja.innerHTML = v.html;                 // ¿se dibuja?
      v.montar(caja, ayudas);                  // ¿los botones quedan conectados?
      // Y que la pantalla no haya quedado en blanco.
      if (!caja.textContent.trim()) throw new Error("la pantalla queda en blanco");

      // Lo que la pantalla se TRAGO sin decir nada tambien cuenta como
      // problema. Si no, un try/catch bien intencionado esconde el bug
      // justo de la prueba que existe para encontrarlo. Me paso al
      // escribir esta misma revision: la primera version daba 16 de 16
      // con el error de esta manana metido a proposito.
      const calladas = (window.__MC2_FALLAS || []).slice();
      if (calladas.length) {
        res.push({ ruta, ok:false,
                   msg:calladas.map(f => `${f.zona}: ${f.msg}`).join(" | ").slice(0, 200) });
      } else {
        res.push({ ruta, ok:true });
      }
    } catch (e) {
      res.push({ ruta, ok:false, msg:String(e && e.message || e).slice(0, 200) });
    }
  }

  caja.remove();
  return res;
};

function ir(ruta, params = {}, usuario = null) {
  if (usuario) estado.usuario = usuario;
  estado.ruta = ruta;
  estado.params = params;
  try { history.pushState({ ruta, params }, "", "#" + ruta); } catch (e) { /* nada */ }
  render();
}

// pantalla de inicio segun el rol
const casa = (u) => {
  if (u && u.rol === "contratista") return "c-trabajos";
  if (u && u.rol === "staff_mc2") return "p-cola";
  return "inicio";
};

window.addEventListener("popstate", (ev) => {
  const s = ev.state;
  if (s && s.ruta) { estado.ruta = s.ruta; estado.params = s.params || {}; render(); }
  else if (estado.usuario) { estado.ruta = casa(estado.usuario); estado.params = {}; render(); }
});

// ---------------------------------------------------------------- arranque
(async function arrancar() {
  pintarCargando();
  // Los precios se traen de Supabase antes de dibujar nada, para que
  // nunca se le muestre al cliente un precio viejo.
  try { await cargarCatalogo(); } catch (e) { /* seguimos con el respaldo */ }
  try { estado.usuario = await API.sesion(); }
  catch (e) { estado.usuario = null; }
  estado.ruta = estado.usuario ? casa(estado.usuario) : "entrada";
  await render();
})();

// ---------------------------------------------------------------- instalar
let promptInstalar = null;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  promptInstalar = e;
  mostrarInstalar();
});

function mostrarInstalar() {
  if (document.querySelector(".instalar")) return;
  try { if (sessionStorage.getItem("mc2_instalar_no")) return; } catch (e) { /* nada */ }
  const caja = document.createElement("div");
  caja.className = "instalar";
  caja.innerHTML = `
    <div class="t">Instala MC2 en tu celular para tenerla a un toque.</div>
    <button id="i-si">Instalar</button>
    <button class="x" id="i-no" aria-label="Cerrar">&times;</button>`;
  document.body.appendChild(caja);
  caja.querySelector("#i-si").onclick = async () => {
    caja.remove();
    if (promptInstalar) { promptInstalar.prompt(); promptInstalar = null; }
  };
  caja.querySelector("#i-no").onclick = () => {
    try { sessionStorage.setItem("mc2_instalar_no", "1"); } catch (e) { /* nada */ }
    caja.remove();
  };
}

// ---------------------------------------------------------------- offline
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => { /* sin offline, no pasa nada */ });
  });
}

return {};
})();

})();
